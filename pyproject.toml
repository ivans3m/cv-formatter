[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvfmt"
version = "0.2.0"
description = "Reference local CLI for the cv-md/1.1 plain-text career data model: validate, tailor, import, and render minimalist ATS/LLM-readable PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typst>=0.14.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cvfmt = "cvfmt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvfmt = ["fonts/*.ttf", "fonts/LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
