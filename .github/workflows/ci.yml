name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

      - name: CLI smoke check
        run: |
          cvfmt version
          cvfmt validate tests/fixtures/senior-eu-2page.md
          cvfmt render tests/fixtures/senior-eu-2page.md -o /tmp/ci-smoke.pdf --verify
          cvfmt tailor tests/fixtures/jd-backend-sample.txt --base tests/fixtures/senior-eu-2page.md -o /tmp/ci-tailored.md --mode strict
          cvfmt validate /tmp/ci-tailored.md
